<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dileep Bhakti Geet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #ff9800, #ff5722);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .card h2 {
      color: #e65100;
      margin-bottom: 12px;
    }

    .songs {
      display: grid;
      gap: 15px;
    }

    .song {
      background: #fff3e0;
      padding: 18px;
      border-radius: 12px;
    }

    .song h3 {
      color: #d84315;
      margin-bottom: 5px;
    }

    .youtube {
      text-align: center;
    }

    .youtube a {
      display: inline-block;
      background: #e51e25;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #333;
      color: white;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }

      header p {
        font-size: 16px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🙏 Dileep Bhakti Geet 🙏</h1>
    <p>भक्ति गीतों और भजनों की मधुर दुनिया</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🌸 हमारे बारे में</h2>
      <p>
        Dileep Bhakti Geet पर आपको भगवान श्री कृष्ण,
        राधा रानी, गणेश जी
